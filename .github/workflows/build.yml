name: Build Bublu APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bublu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v80
          name: Bublu APK v80
          body: "v80 - guided mode teaches any app (WhatsApp, YouTube, Telegram, JioSaavn...) and re-plans with the thinking model when you get stuck; scam alert from notifications; UPI fill up to the PIN."
          files: app/build/outputs/apk/debug/app-debug.apk
